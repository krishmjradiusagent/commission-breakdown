<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity — Radius</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="_ds/radius-ui-design-system-c7220bb1-3534-4549-94e9-dd1c4d80b981/tokens/fonts.css">
<link rel="stylesheet" href="assets/list-page.css">
<style>
/* Activity — moved off the breakdown. Same glass head, same feed vocabulary. */
.phone { overflow:hidden; max-height:calc(100vh - 48px); max-height:calc(100dvh - 48px); }
.screen { position:relative; overflow:hidden;
  --tint-amber-bg:rgba(234,88,12,.16); --tint-amber-fg:#f2a678;
  --tint-red-bg:rgba(220,38,38,.18); --tint-red-fg:#f0a0a0;
  --tint-indigo-bg:rgba(90,95,242,.18); --tint-indigo-fg:#aab0ff;
  --tint-green-bg:rgba(109,165,68,.18); --tint-green-fg:#a9cf80;
  --tint-violet-bg:rgba(107,75,171,.24); --tint-violet-fg:#c9b3f5;
  --tint-gold-bg:rgba(217,165,20,.18); --tint-gold-fg:#f0cf6a; }
.statusbar { position:absolute; top:0; left:0; right:0; z-index:14; }

.pg-head { position:absolute; top:0; left:0; right:0; z-index:13; display:block; padding:calc(44px + env(safe-area-inset-top)) 16px 10px; background:linear-gradient(to bottom, rgba(10,10,10,.86), rgba(10,10,10,.62)); backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%); box-shadow:inset 0 -1px 0 rgba(255,255,255,.07); }
@supports not (backdrop-filter: blur(1px)) { .pg-head { background:rgba(14,14,16,.97); } }
.pg-head .hrow { display:flex; align-items:center; gap:4px; }
.pg-head h1 { font:700 17px/1.2 var(--font-hubot); letter-spacing:-.02em; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.back-btn { position:relative; flex:none; width:34px; height:34px; margin-left:-2px; border-radius:999px; background:rgba(255,255,255,.08); box-shadow:inset 0 0 0 1px rgba(255,255,255,.10), inset 0 1px 0 rgba(255,255,255,.14); display:inline-flex; align-items:center; justify-content:center; color:var(--foreground); transition:background 140ms ease; }
.back-btn::before, .hd-btn::before { content:''; position:absolute; left:50%; top:50%; width:44px; height:44px; transform:translate(-50%,-50%); }
.back-btn:hover { background:rgba(255,255,255,.14); }
.hd-btn { position:relative; flex:none; margin-left:auto; width:38px; height:38px; border:0; border-radius:999px; background:transparent; color:var(--foreground); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
.hd-btn i { font-size:20px; }
.hd-btn:active { transform:scale(.94); }
.hd-btn:focus-visible, .back-btn:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
.subrow { display:flex; align-items:center; gap:10px; margin-top:4px; }
.subrow .prop { min-width:0; flex:1; font:500 13px/1.35 var(--font); color:var(--muted-foreground); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.scroll { padding-top:calc(44px + env(safe-area-inset-top) + 66px); padding-bottom:calc(32px + env(safe-area-inset-bottom)); scrollbar-width:none; }
.scroll::-webkit-scrollbar { display:none; }

.pill { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:999px; font:600 12px/1 var(--font); white-space:nowrap; }
.pill.blue { color:var(--tint-indigo-fg); background:var(--tint-indigo-bg); }
.pill.gold { color:var(--tint-gold-fg); background:var(--tint-gold-bg); }
.pill.violet { color:var(--tint-violet-fg); background:var(--tint-violet-bg); }

/* feed — lifted from the breakdown so entries read identically */
.feed { list-style:none; margin:8px 0 0; padding:0; }
.daysep { padding:14px 0 8px; border-top:1px solid var(--border); font:600 13px/1.2 var(--font); color:var(--muted-foreground); }
.feed > .daysep:first-child { border-top:0; padding-top:4px; }
.cm { display:flex; gap:10px; padding:13px 0; }
.cm + .cm { border-top:1px solid var(--border); }
.cm .ini { width:28px; height:28px; font:600 12px/1 var(--font); }
.cm .ini.aud { background:var(--tint-violet-bg); color:var(--tint-violet-fg); }
.cm .ini.ag { background:var(--tint-indigo-bg); color:var(--tint-indigo-fg); }
.cm .ini.lead { background:var(--tint-gold-bg); color:var(--tint-gold-fg); }
.cm .acic { flex:none; width:28px; display:flex; align-items:flex-start; justify-content:center; padding-top:2px; color:var(--muted-foreground); }
.cm .acic i { font-size:17px; line-height:1; }
.cm .cb { min-width:0; flex:1; display:flex; flex-direction:column; gap:4px; }
.cm .ch { display:flex; align-items:center; gap:7px; flex-wrap:nowrap; }
.cm .ch b { min-width:0; font:600 15px/1.25 var(--font); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cm .ch .pill { flex:none; }
.cm .ch > time { flex:none; margin-left:auto; padding-left:4px; font:500 13px/1 var(--font); color:var(--muted-foreground); font-variant-numeric:tabular-nums; }
.cm .ct { font:400 15px/1.45 var(--font); color:var(--foreground); text-wrap:pretty; }
.cm .ct .mention { font-weight:600; color:var(--tint-indigo-fg); }
.cm.act .ch b { color:var(--muted-foreground); }
.cm.act .ct { color:var(--muted-foreground); }
.aclines { list-style:none; margin:2px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
.aclines li { display:flex; align-items:flex-start; gap:10px; }
.aclines .ct { flex:1; min-width:0; }
.aclines time { flex:none; font:500 13px/1.45 var(--font); color:var(--muted-foreground); font-variant-numeric:tabular-nums; }
.earlier { padding:2px 0; }
.earlier button { position:relative; display:inline-flex; align-items:center; gap:6px; padding:8px 0; border:0; background:transparent; color:var(--tint-indigo-fg); font:600 13px/1.2 var(--font); cursor:pointer; }
.earlier button i { font-size:14px; }
.earlier button::before { content:''; position:absolute; left:-8px; right:-8px; top:50%; height:44px; transform:translateY(-50%); }
.earlier button:focus-visible { outline:2px solid var(--ring); outline-offset:3px; border-radius:4px; }
.noagent { padding:11px 25px 11px 2px; font:500 13px/1.35 var(--font); color:var(--muted-foreground); text-wrap:pretty; }
.note { margin:18px 4px 0; font:500 12px/1.5 var(--font); color:var(--muted-foreground); text-wrap:pretty; }
</style>
</head>
<body>

<div class="phone">
  <div class="screen" id="screen" data-role="agent" data-screen-label="Activity">
    <div class="statusbar"><span>9:41</span>
      <div class="sb-icons">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" opacity="0.7"/></svg>
        <svg width="20" height="12" viewBox="0 0 22 12" fill="none" stroke="currentColor"><rect x="1" y="1" width="17" height="10" rx="3"/><rect x="3" y="3" width="11" height="6" rx="1.5" fill="currentColor" stroke="none"/><path d="M20 4v4" stroke-linecap="round"/></svg>
      </div>
    </div>

    <div class="pg-head">
      <div class="hrow">
        <a href="Commission breakdown.html" id="backLink" class="back-btn" aria-label="Back to the commission breakdown">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </a>
        <h1>Activity</h1>
      </div>
      <div class="subrow">
        <span class="prop" id="actSub">1284 Willow Creek Dr</span>
      </div>
    </div>

    <div class="scroll" id="scroll">
      <ul class="feed" id="actFeed"></ul>
      <p class="note">Comments are posted from the breakdown. Everything on this deal is logged here, oldest first.</p>
    </div>

  </div>
</div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var addr = q.get('addr') || '1284 Willow Creek Dr';
  document.getElementById('actSub').textContent = addr;
  document.getElementById('backLink').href = 'Commission breakdown.html' + (location.search || '');

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var TODAY = '2026-09-15';
  var TINT = { aud: 'violet', ag: 'blue', lead: 'gold' };
  var ROLE_LABEL = { aud: 'Auditor', ag: 'Agent', lead: 'Team lead' };
  var VISIBLE_GROUPS = 4, feedExpanded = false;

  /* same entries the breakdown carried */
  var FEED = [
    { who: 'Jessica Hall', ini: 'JH', role: 'aud', day: '2026-05-12', time: '10:08 AM', iso: '2026-05-12T10:08', text: 'Commission breakdown draft created for ' + addr + '.', act: true },
    { who: 'Jessica Hall', ini: 'JH', role: 'aud', day: '2026-05-12', time: '10:14 AM', iso: '2026-05-12T10:14', text: 'Commission allocation set to 50% on each side.', act: true },
    { who: 'Jessica Hall', ini: 'JH', role: 'aud', day: '2026-05-12', time: '10:18 AM', iso: '2026-05-12T10:18', text: 'Added side deductions — Credits at $50 and Referral at $20.', act: true },
    { who: 'Mark Perez', ini: 'MP', role: 'ag', day: '2026-05-12', time: '11:02 AM', iso: '2026-05-12T11:02', text: '@Jessica Hall can you double-check the E&O amount? Last deal it was $200.', act: false },
    { who: 'Jessica Hall', ini: 'JH', role: 'aud', day: '2026-05-12', time: '11:20 AM', iso: '2026-05-12T11:20', text: 'Confirmed with compliance — $250 is correct for 2026 closings.', act: false },
    { who: 'Jessica Hall', ini: 'JH', role: 'aud', day: '2026-09-14', time: '4:41 PM', iso: '2026-09-14T16:41', text: 'E&O fee updated to $250 on both sides.', act: true },
    { who: 'Andy Martin', ini: 'AM', role: 'lead', day: '2026-09-15', time: '9:12 AM', iso: '2026-09-15T09:12', text: 'Numbers look right to me — @Mark Perez ready for your confirmation.', act: false }
  ];

  function dayLabel(day) {
    if (day === TODAY) return 'Today';
    var p = day.split('-');
    return MONTHS[+p[1] - 1] + ' ' + (+p[2]) + ', ' + p[0];
  }
  function timeEl(iso, txt) {
    var t = document.createElement('time'); t.setAttribute('datetime', iso); t.textContent = txt; return t;
  }
  function textInto(host, text) {
    var re = /@([A-Z][a-zÀ-ɏ]+(?: [A-Z][a-zÀ-ɏ]+)?)/g, i = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > i) host.appendChild(document.createTextNode(text.slice(i, m.index)));
      var s = document.createElement('span'); s.className = 'mention'; s.textContent = m[0];
      host.appendChild(s); i = m.index + m[0].length;
    }
    if (i < text.length) host.appendChild(document.createTextNode(text.slice(i)));
  }
  /* consecutive activity entries by the same author on the same day collapse into one block */
  function groupFeed(items) {
    var g = [];
    items.forEach(function (f) {
      var last = g[g.length - 1];
      if (f.act && last && last.act && last.who === f.who && last.day === f.day) { last.items.push(f); return; }
      g.push({ act: f.act, who: f.who, ini: f.ini, role: f.role, day: f.day, items: [f] });
    });
    return g;
  }
  function commentRow(g) {
    var f = g.items[0];
    var row = document.createElement('li'); row.className = 'cm';
    var ini = document.createElement('span'); ini.className = 'ini ' + f.role;
    ini.textContent = f.ini; ini.setAttribute('aria-hidden', 'true');
    var cb = document.createElement('span'); cb.className = 'cb';
    var ch = document.createElement('span'); ch.className = 'ch';
    var b = document.createElement('b'); b.textContent = f.who;
    var pill = document.createElement('span'); pill.className = 'pill ' + TINT[f.role];
    pill.textContent = ROLE_LABEL[f.role];
    ch.appendChild(b); ch.appendChild(pill); ch.appendChild(timeEl(f.iso, f.time));
    var ct = document.createElement('span'); ct.className = 'ct'; textInto(ct, f.text);
    cb.appendChild(ch); cb.appendChild(ct);
    row.appendChild(ini); row.appendChild(cb);
    return row;
  }
  function activityRow(g) {
    var row = document.createElement('li'); row.className = 'cm act';
    var ic = document.createElement('span'); ic.className = 'acic'; ic.setAttribute('aria-hidden', 'true');
    ic.innerHTML = '<i class="ph ph-clock-counter-clockwise"></i>';
    var cb = document.createElement('span'); cb.className = 'cb';
    var ch = document.createElement('span'); ch.className = 'ch';
    var b = document.createElement('b'); b.textContent = g.who + ' · activity';
    ch.appendChild(b);
    var first = g.items[0], last = g.items[g.items.length - 1];
    if (g.items.length === 1) {
      ch.appendChild(timeEl(first.iso, first.time));
      cb.appendChild(ch);
      var ct = document.createElement('span'); ct.className = 'ct'; ct.textContent = first.text;
      cb.appendChild(ct);
    } else {
      ch.appendChild(timeEl(first.iso, first.time + ' – ' + last.time));
      cb.appendChild(ch);
      var ul = document.createElement('ul'); ul.className = 'aclines';
      g.items.forEach(function (f) {
        var li = document.createElement('li');
        var t = document.createElement('span'); t.className = 'ct'; t.textContent = f.text;
        li.appendChild(t); li.appendChild(timeEl(f.iso, f.time)); ul.appendChild(li);
      });
      cb.appendChild(ul);
    }
    row.appendChild(ic); row.appendChild(cb);
    return row;
  }
  function renderFeed() {
    var host = document.getElementById('actFeed');
    host.textContent = '';
    if (!FEED.length) {
      var e = document.createElement('li'); e.className = 'noagent';
      e.textContent = 'Nothing here yet — start the thread on the breakdown.';
      host.appendChild(e); return;
    }
    var groups = groupFeed(FEED);
    var hiddenCount = feedExpanded ? 0 : Math.max(0, groups.length - VISIBLE_GROUPS);
    if (hiddenCount) {
      var n = 0;
      groups.slice(0, hiddenCount).forEach(function (g) { n += g.items.length; });
      var li = document.createElement('li'); li.className = 'earlier';
      var btn = document.createElement('button'); btn.type = 'button';
      btn.innerHTML = '<i class="ph ph-arrow-up" aria-hidden="true"></i>';
      btn.appendChild(document.createTextNode('Show earlier activity (' + n + ')'));
      btn.addEventListener('click', function () { feedExpanded = true; renderFeed(); });
      li.appendChild(btn); host.appendChild(li);
    }
    var lastDay = null;
    groups.slice(hiddenCount).forEach(function (g) {
      if (g.day !== lastDay) {
        lastDay = g.day;
        var d = document.createElement('li'); d.className = 'daysep'; d.textContent = dayLabel(g.day);
        host.appendChild(d);
      }
      host.appendChild(g.act ? activityRow(g) : commentRow(g));
    });
  }

  var headEl = document.querySelector('.pg-head'), scrollEl = document.getElementById('scroll');
  function fitHead() { scrollEl.style.paddingTop = (headEl.offsetHeight + 8) + 'px'; }
  window.addEventListener('resize', fitHead); fitHead();
  renderFeed();
})();
</script>
</body>
</html>
