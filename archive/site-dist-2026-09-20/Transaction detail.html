<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction — Radius</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="_ds/radius-ui-design-system-c7220bb1-3534-4549-94e9-dd1c4d80b981/tokens/fonts.css">
<link rel="stylesheet" href="_ds/radius-ui-design-system-c7220bb1-3534-4549-94e9-dd1c4d80b981/tokens/radius.css">
<link rel="stylesheet" href="assets/list-page.css">
<style>
/* Transaction detail — documents workspace for one deal. */
.phone { overflow:hidden; }
.scroll { flex:1; min-height:0; overflow-y:auto; padding:0 0 12px; scrollbar-width:none; }
.scroll::-webkit-scrollbar { display:none; }

/* deal header */
.deal { display:flex; align-items:center; gap:12px; padding:38px 16px 22px; }
.deal .dt { flex:1; min-width:0; }
.deal h1 { margin:0; font:500 19px/1.25 var(--font); letter-spacing:-.01em; }
.deal .who { margin:3px 0 0; font:400 15px/1.3 var(--font); color:var(--muted-foreground); }
.status { position:relative; flex:none; display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 12px; border:0; border-radius:999px; background:rgba(109,165,68,.16); color:#cfe6a8; font:500 14px/1 var(--font); cursor:pointer; }
.status i { font-size:16px; }
.status i.cv { font-size:15px; }
.status:active { transform:scale(.98); }
.status:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }

/* full-bleed section bars */
.bar { display:flex; align-items:center; gap:12px; width:100%; min-height:56px; padding:14px 16px; border:0; text-align:left; text-decoration:none; cursor:pointer; font:500 18px/1.3 var(--font); }
.bar > span { flex:1; min-width:0; }
.bar > span.cmt { flex:none; }
.bar .go { flex:none; font-size:20px; }
.bar.pri { background:var(--primary); color:#fff; }
.bar.sec { background:var(--muted); color:var(--foreground); box-shadow:inset 0 -1px 0 var(--border); }
.bar.sec .go { color:var(--muted-foreground); }
.bar:active { filter:brightness(.94); }
.bar:focus-visible { outline:2px solid var(--ring); outline-offset:-3px; }
/* comments affordance in the corner of the commission bar */
.cmt { position:relative; flex:none; width:36px; height:36px; margin-right:2px; border-radius:999px; background:rgba(255,255,255,.06); color:var(--foreground); font-size:19px; display:inline-flex; align-items:center; justify-content:center; }
.cmt .n { position:absolute; top:-5px; right:-5px; min-width:19px; height:19px; padding:0 5px; border-radius:999px; border:2px solid var(--muted); background:var(--primary); color:#fff; font:600 11px/15px var(--font); font-variant-numeric:tabular-nums; text-align:center; }

/* purchase details rows */
.pd { padding:2px 16px 8px; background:var(--muted); box-shadow:inset 0 -1px 0 var(--border); }
.pd .kv { display:flex; align-items:center; gap:12px; min-height:52px; padding:10px 0; border-top:1px solid var(--border); }
.pd .kv:first-child { border-top:0; }
.pd .kv .k { min-width:0; flex:1; font:500 15px/1.35 var(--font); color:var(--muted-foreground); }
.pd .kv .v { flex:none; max-width:60%; text-align:right; font:600 15px/1.35 var(--font); font-variant-numeric:tabular-nums; text-wrap:pretty; }
#pdToggle[aria-expanded="true"] .go { transform:rotate(90deg); }

/* source tabs */
.srcs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:11px; padding:14px 16px 16px; }
.src { display:flex; flex-direction:column; gap:14px; min-height:66px; padding:11px 12px; border-radius:var(--radius-lg); border:1px solid var(--border); background:transparent; color:var(--foreground); font:500 14px/1.2 var(--font); text-align:left; cursor:pointer; transition:transform 160ms cubic-bezier(.23,1,.32,1); }
.src i { font-size:21px; color:var(--primary); }
.src:active { transform:scale(.98); }
.src:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
.src[aria-selected="true"] { background:var(--primary); border-color:transparent; color:#fff; }
.src[aria-selected="true"] i { color:#fff; }

/* add-documents bar */
.add { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:54px; padding:14px 16px; border:0; background:rgba(90,95,242,.16); color:#aab0ff; font:500 19px/1 var(--font); cursor:pointer; }
.add i { font-size:19px; }
.add:active { filter:brightness(1.1); }
.add:focus-visible { outline:2px solid var(--ring); outline-offset:-3px; }

.count { padding:22px 16px 18px; font:500 13px/1 var(--font); letter-spacing:.09em; text-transform:uppercase; color:var(--muted-foreground); box-shadow:inset 0 -1px 0 var(--border); }

/* document rows */
.doc { display:flex; align-items:flex-start; gap:14px; padding:16px; box-shadow:inset 0 -1px 0 var(--border); }
/* Radius UI checkbox — primary fill, DS checkmark, DS focus ring */
.cbx { position:relative; flex:none; width:24px; height:24px; margin-top:2px; padding:0; border-radius:var(--radius-sm); border:1px solid #737373; background:var(--background); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
.cbx::before { content:''; position:absolute; left:50%; top:50%; width:44px; height:44px; transform:translate(-50%,-50%); }
.cbx[aria-checked="true"] { background:var(--primary); border-color:var(--primary); }
.cbx[aria-checked="true"]::after { content:''; width:14px; height:14px; background:#fff; clip-path:polygon(14% 44%,0 65%,40% 100%,100% 16%,84% 0,39% 60%); }
.cbx:focus-visible { outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }
.db { min-width:0; flex:1; display:flex; flex-direction:column; gap:12px; }
.db b { font:400 17px/1.35 var(--font); text-wrap:pretty; }
.dacts { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.prev { position:relative; display:inline-flex; align-items:center; gap:7px; height:40px; padding:0 15px; border:0; border-radius:999px; background:#2A2A2E; color:var(--foreground); font:400 15px/1 var(--font); cursor:pointer; }
.prev i { font-size:16px; }
.fill { position:relative; display:inline-flex; align-items:center; gap:9px; height:40px; padding:0 8px 0 16px; border:0; border-radius:999px; background:var(--primary); color:#fff; font:400 15px/1 var(--font); cursor:pointer; }
.fill .n { min-width:26px; height:26px; padding:0 7px; border-radius:999px; background:#fff; color:var(--primary); font:600 14px/26px var(--font); font-variant-numeric:tabular-nums; text-align:center; }
.fill i { font-size:16px; }
.sign { position:relative; flex:none; width:40px; height:40px; border-radius:var(--radius-md); border:1px solid var(--border); background:transparent; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
.sign i { font-size:19px; background:linear-gradient(90deg,#7B7FF5,#5A5FF2 40%,#F08068 78%,#F0A468); -webkit-background-clip:text; background-clip:text; color:transparent; }
.prev:active, .fill:active, .sign:active { transform:scale(.97); }
.prev:focus-visible, .fill:focus-visible, .sign:focus-visible { outline:2px solid var(--ring); outline-offset:2px; }

.empty { padding:40px 16px; text-align:center; color:var(--muted-foreground); font:500 14px/1.5 var(--font); }

.footer { flex:none; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); background:var(--background); }
.cta { width:100%; height:60px; border:0; border-radius:999px; background:var(--primary); color:#fff; font:500 19px/1 var(--font); cursor:pointer; }
.cta[data-idle] { opacity:.55; color:rgba(255,255,255,.62); }
.cta:active { transform:scale(.99); }
.cta:focus-visible { outline:2px solid var(--ring); outline-offset:3px; }

.toast { position:absolute; left:20px; right:20px; bottom:calc(104px + env(safe-area-inset-bottom)); z-index:30; background:#26262A; color:var(--foreground); border-radius:var(--radius-lg); padding:12px 14px; font:500 13px/1.35 var(--font); box-shadow:0 6px 24px rgba(0,0,0,.45); opacity:0; transform:translateY(10px); transition:opacity 160ms ease, transform 160ms ease; pointer-events:none; }
.toast.on { opacity:1; transform:none; }

@media (prefers-reduced-motion: reduce) { .toast, .src, .prev, .fill, .sign, .cta { transition:none; } }
</style>
</head>
<body>

<div class="phone">
  <div class="screen" data-screen-label="Transaction detail">
    <div class="statusbar"><span>9:41</span>
      <div class="sb-icons">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="2.5" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 10.6 6.2 8.8a2.6 2.6 0 0 1 3.6 0L8 10.6Zm-3.2-3.2L3.4 6a6.6 6.6 0 0 1 9.2 0l-1.4 1.4a4.6 4.6 0 0 0-6.4 0ZM1.6 4.2.2 2.8a11 11 0 0 1 15.6 0l-1.4 1.4a9 9 0 0 0-12.8 0Z"/></svg>
        <svg width="20" height="12" viewBox="0 0 22 12" fill="none" stroke="currentColor"><rect x="1" y="1" width="17" height="10" rx="3"/><rect x="3" y="3" width="13" height="6" rx="1.5" fill="currentColor" stroke="none"/><path d="M20 4v4" stroke-linecap="round"/></svg>
      </div>
    </div>

    <div class="scroll">
      <div class="deal">
        <div class="dt">
          <h1>6653 Tralee Village Dr</h1>
          <p class="who">Arthur Wilson</p>
        </div>
        <button class="status" type="button" data-toast="Change the transaction status">
          <i class="ph ph-broadcast" aria-hidden="true"></i>New client<i class="ph ph-caret-down cv" aria-hidden="true"></i>
        </button>
      </div>

      <button class="bar pri" type="button" id="pdToggle" aria-expanded="false" aria-controls="purchase-details">
        <span>Purchase Details</span><i class="ph ph-caret-right go" aria-hidden="true"></i>
      </button>
      <div class="pd" id="purchase-details" hidden>
        <div class="kv"><span class="k">Sale price</span><span class="v">$1,150,000</span></div>
        <div class="kv"><span class="k">Side</span><span class="v">Buyer — you represent the buyer</span></div>
        <div class="kv"><span class="k">Property</span><span class="v">Single family · 3 bed, 2 bath</span></div>
        <div class="kv"><span class="k">Contract date</span><span class="v">Aug 14, 2026</span></div>
        <div class="kv"><span class="k">Closing date</span><span class="v">Sep 12, 2026</span></div>
      </div>

      <a class="bar sec" aria-label="Commission breakdown — 3 new comments" href="Commission breakdown.html?addr=6653%20Tralee%20Village%20Dr&amp;price=1150000&amp;side=buyer&amp;close=Close%20Sep%2012">
        <span>Commission Breakdown</span>
        <span class="cmt" aria-hidden="true"><i class="ph ph-chat-circle"></i><span class="n">3</span></span>
        <i class="ph ph-caret-right go" aria-hidden="true"></i>
      </a>

      <div class="srcs" role="tablist" aria-label="Document source">
        <button class="src" role="tab" type="button" data-src="documents" aria-selected="true"><i class="ph ph-file-text" aria-hidden="true"></i>Documents</button>
        <button class="src" role="tab" type="button" data-src="envelopes" aria-selected="false"><i class="ph ph-envelope-simple" aria-hidden="true"></i>Envelopes</button>
        <button class="src" role="tab" type="button" data-src="sent" aria-selected="false"><i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>Sent</button>
      </div>

      <button class="add" type="button" data-toast="Add documents from the form library">
        <i class="ph ph-plus" aria-hidden="true"></i>Documents<i class="ph ph-caret-down" aria-hidden="true"></i>
      </button>

      <p class="count" id="count">Documents (6)</p>

      <div id="docs"></div>
      <p class="empty" id="empty" hidden>Nothing here yet.</p>
    </div>

    <div class="footer">
      <button class="cta" type="button" id="ctaBtn">Create Envelope</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
(function () {
  var toastEl = document.getElementById('toast'), tt;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(tt); tt = setTimeout(function () { toastEl.classList.remove('on'); }, 2600);
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-toast]'); if (b) toast(b.getAttribute('data-toast'));
  });

  var SETS = {
    documents: [
      { id: 'aba', name: 'Radius Agent — Affiliated Business Arrangement', on: true, fields: 10 },
      { id: 'bia', name: "BIA — Buyer's Inspection Advisory", on: true },
      { id: 'crb', name: 'CR-B — Buyer Contingency Removal #1', on: false },
      { id: 'wfa', name: 'WFA — Wire Fraud Advisory', on: false },
      { id: 'ccpa', name: 'CCPA — California Consumers Privacy Act Advisory', on: false },
      { id: 'ad', name: 'AD — Disclosure Regarding RE Agency', on: false }
    ],
    envelopes: [
      { id: 'e1', name: 'Offer packet — awaiting Arthur Wilson', on: false },
      { id: 'e2', name: 'Disclosure packet — draft', on: false }
    ],
    sent: [
      { id: 's1', name: 'Listing agreement — signed Aug 22, 2026', on: false },
      { id: 's2', name: 'Wire instructions — sent Aug 28, 2026', on: false }
    ]
  };

  var src = 'documents', host = document.getElementById('docs'),
      emptyEl = document.getElementById('empty'), countEl = document.getElementById('count'),
      cta = document.getElementById('ctaBtn');

  var LABEL = { documents: 'Documents', envelopes: 'Envelopes', sent: 'Sent' };

  function render() {
    var list = SETS[src];
    countEl.textContent = LABEL[src] + ' (' + list.length + ')';
    host.textContent = '';

    list.forEach(function (d) {
      var row = document.createElement('div'); row.className = 'doc';

      var cb = document.createElement('button');
      cb.type = 'button'; cb.className = 'cbx'; cb.setAttribute('role', 'checkbox');
      cb.setAttribute('aria-checked', d.on ? 'true' : 'false');
      cb.setAttribute('aria-label', (d.on ? 'Deselect ' : 'Select ') + d.name);
      cb.addEventListener('click', function () { d.on = !d.on; render(); });

      var db = document.createElement('div'); db.className = 'db';
      var b = document.createElement('b'); b.textContent = d.name;

      var acts = document.createElement('div'); acts.className = 'dacts';

      var prev = document.createElement('button');
      prev.type = 'button'; prev.className = 'prev';
      prev.setAttribute('data-toast', 'Preview — ' + d.name);
      prev.innerHTML = '<i class="ph ph-eye" aria-hidden="true"></i>Preview';
      acts.appendChild(prev);

      if (d.fields) {
        var fill = document.createElement('button');
        fill.type = 'button'; fill.className = 'fill';
        fill.setAttribute('data-toast', d.fields + ' fields left to fill on this form');
        fill.setAttribute('aria-label', 'View and fill ' + d.name + ' — ' + d.fields + ' fields left');
        fill.innerHTML = 'View &amp; fill <span class="n">' + d.fields + '</span><i class="ph ph-caret-right" aria-hidden="true"></i>';
        acts.appendChild(fill);
      }

      var sign = document.createElement('button');
      sign.type = 'button'; sign.className = 'sign';
      sign.setAttribute('aria-label', 'Send ' + d.name + ' for signature');
      sign.setAttribute('data-toast', 'Sends ' + d.name + ' out for signature');
      sign.innerHTML = '<i class="ph ph-infinity" aria-hidden="true"></i>';
      acts.appendChild(sign);

      db.appendChild(b); db.appendChild(acts);
      row.appendChild(cb); row.appendChild(db); host.appendChild(row);
    });

    emptyEl.hidden = list.length > 0;

    var n = list.filter(function (d) { return d.on; }).length;
    if (n) { cta.removeAttribute('data-idle'); } else { cta.setAttribute('data-idle', ''); }
  }

  Array.prototype.forEach.call(document.querySelectorAll('.src'), function (t) {
    t.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('.src'), function (o) {
        o.setAttribute('aria-selected', o === t ? 'true' : 'false');
      });
      src = t.getAttribute('data-src');
      render();
    });
  });

  cta.addEventListener('click', function () {
    var n = SETS[src].filter(function (d) { return d.on; }).length;
    toast(n ? 'Envelope created with ' + n + (n === 1 ? ' document' : ' documents') : 'Select the documents to include first');
  });

  var pdT = document.getElementById('pdToggle'), pd = document.getElementById('purchase-details');
  pdT.addEventListener('click', function () {
    var open = pdT.getAttribute('aria-expanded') === 'true';
    pdT.setAttribute('aria-expanded', open ? 'false' : 'true');
    pd.hidden = open;
  });

  render();
})();
</script>
</body>
</html>
