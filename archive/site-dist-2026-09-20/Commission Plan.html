<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commission Plan — Radius</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="_ds/radius-ui-design-system-c7220bb1-3534-4549-94e9-dd1c4d80b981/tokens/fonts.css">
<link rel="stylesheet" href="assets/list-page.css">
<style>
.scroll { padding-top:12px; }
.pg-titlewrap { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.pg-subtitle { font:400 13px/1.4 var(--font); color:var(--muted-foreground); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fab { position:absolute; right:20px; bottom:calc(20px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:999px; border:0; background:var(--primary); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 6px 16px rgba(90,95,242,0.45); cursor:pointer; z-index:5; }
.fab:active { transform:scale(0.96); }

.cp-row { display:flex; align-items:center; gap:10px; padding:14px 2px; border-top:1px solid var(--border); cursor:pointer; transition:transform 160ms cubic-bezier(0.23,1,0.32,1), background 140ms ease; }
.cp-row:first-child { border-top:0; }
.cp-row:active { background:var(--muted); transform:scale(0.99); }
.cp-row:focus-visible { outline:2px solid var(--ring); outline-offset:-2px; border-radius:var(--radius-sm); }
.cp-content { flex:1; min-width:0; }
.cp-chev { flex:none; font-size:16px; color:var(--muted-foreground); opacity:.7; }
.cp-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.cp-name { font:600 15px/1.3 var(--font-hubot); letter-spacing:var(--tracking-tight); flex:1; min-width:0; }
.cp-type { font:600 12px/1 var(--font); padding:4px 8px; border-radius:999px; flex:none; }
.cp-type.standard { background:var(--muted); color:var(--muted-foreground); }
.cp-type.tiered { background:rgba(234,88,12,0.16); color:#ffab6b; }
.cp-group-tag { font:600 11px/1 var(--font); padding:3px 7px; border-radius:999px; background:rgba(90,95,242,0.14); color:#c3c6ff; flex:none; }
.cp-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; }
.cp-by { font:500 13px/1.2 var(--font); color:var(--muted-foreground); white-space:nowrap; }
.cp-by b { color:#8fce6a; font-weight:600; }
.cp-assign { position:relative; min-height:36px; padding:0 16px; border:0; border-radius:999px; background:rgba(255,255,255,.07); box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); color:var(--foreground); font:600 13px/1 var(--font); cursor:pointer; flex:none; transition:transform 140ms ease, background 140ms ease; }
.cp-assign::before { content:''; position:absolute; left:50%; top:50%; width:100%; height:44px; min-width:44px; transform:translate(-50%,-50%); }
.cp-assign:active { transform:scale(.96); background:rgba(255,255,255,.13); }
.cp-assigned-tag { font:600 12px/1 var(--font); padding:5px 9px; border-radius:999px; background:rgba(109,165,68,0.14); color:#8fce6a; flex:none; }
.cp-none { font:400 13px/1.2 var(--font); color:var(--muted-foreground); font-style:italic; }
.astack { display:flex; align-items:center; }
.astack .ini { width:24px; height:24px; font-size:10px; overflow:hidden; position:relative; margin-left:-8px; border:2px solid var(--card); box-sizing:content-box; }
.astack .ini:first-child { margin-left:0; }

/* full-screen sheets */
.sheet { position:absolute; inset:0; background:var(--background); z-index:30; display:flex; flex-direction:column; transform:translateY(100%); transition:transform 280ms cubic-bezier(0.23,1,0.32,1); }
.sheet.show { transform:translateY(0); }
.sheet.closing { transition:transform 200ms cubic-bezier(0.23,1,0.32,1); }
.sheet[hidden] { display:none; }
.sheet-head { display:flex; align-items:center; gap:12px; padding:calc(16px + env(safe-area-inset-top)) 16px 12px; border-bottom:1px solid var(--border); flex:none; }
.sheet-titlewrap { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.sheet-subtitle { font:400 12px/1.3 var(--font); color:var(--muted-foreground); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sheet-x { position:relative; width:36px; height:36px; border-radius:999px; border:0; background:var(--muted); color:var(--foreground); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:none; font-size:16px; transition:transform 140ms ease; }
.sheet-x::before { content:''; position:absolute; left:50%; top:50%; width:44px; height:44px; transform:translate(-50%,-50%); }
.sheet-x:active { transform:scale(.94); }
.sheet-title { flex:1; min-width:0; margin:0; font:700 17px/1.3 var(--font-hubot); letter-spacing:var(--tracking-tight); }
.sheet-scroll { flex:1; min-height:0; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:18px; }
.fld { display:flex; flex-direction:column; gap:8px; }
.fld > label { font:600 13px/1.3 var(--font); }
.fld > label .req { color:#ff8080; margin-left:2px; }
.fld input[type="text"], .fld input[type="number"] { height:44px; padding:0 12px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--muted); color:var(--foreground); font:500 15px/1 var(--font); width:100%; }
.fld input::placeholder { color:var(--muted-foreground); }
.curr { display:flex; align-items:center; gap:4px; height:44px; padding:0 12px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--muted); }
.curr span { color:var(--muted-foreground); font:500 15px/1 var(--font); }
.curr input { border:0; background:transparent; flex:1; min-width:0; padding:0; height:auto; font:500 15px/1 var(--font); color:var(--foreground); }
.dd-btn { display:flex; align-items:center; justify-content:space-between; height:44px; padding:0 12px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--muted); color:var(--foreground); font:500 15px/1 var(--font); cursor:pointer; width:100%; text-align:left; transition:transform 140ms ease; }
.dd-btn:active { transform:scale(.98); }
.dd-btn i { color:var(--muted-foreground); font-size:16px; transition:transform 150ms ease; }
.dd-btn.open i { transform:rotate(180deg); }
.dd-list { display:flex; flex-direction:column; max-height:0; opacity:0; transform:scaleY(0.96); transform-origin:top; overflow:hidden; pointer-events:none; border:1px solid transparent; border-radius:var(--radius-md); background:var(--card); transition:max-height 200ms cubic-bezier(0.23,1,0.32,1), opacity 160ms ease, transform 160ms cubic-bezier(0.23,1,0.32,1), border-color 160ms ease; }
.dd-list.open { max-height:400px; opacity:1; transform:scaleY(1); pointer-events:auto; border-color:var(--border); }
.dd-item { display:flex; align-items:center; justify-content:space-between; width:100%; padding:12px; border:0; border-top:1px solid var(--border); background:transparent; color:inherit; font:500 15px/1.3 var(--font); text-align:left; cursor:pointer; transition:background 120ms ease; }
.dd-item:first-child { border-top:0; }
.dd-item:active { background:var(--muted); }
.dd-item i { color:var(--muted-foreground); font-size:16px; }
.fld .sh-tabs { margin:0; }
.fld-help { font:400 12px/1.5 var(--font); color:var(--muted-foreground); }
.fld-help.err { color:#ff8080; }
.split-row { display:flex; gap:12px; }
.split-row .fld { flex:1; }
.chk-item { display:flex; align-items:center; gap:10px; width:100%; padding:12px; border:0; border-top:1px solid var(--border); background:transparent; color:inherit; font:500 15px/1.3 var(--font); text-align:left; cursor:pointer; transition:background 120ms ease; }
.chk-item:first-child { border-top:0; }
.chk-item:active { background:var(--muted); }
.chk-box { width:20px; height:20px; border-radius:5px; border:1.5px solid var(--input); flex:none; display:inline-flex; align-items:center; justify-content:center; background:transparent; transition:background 140ms ease, border-color 140ms ease; }
.chk-box.checked { background:var(--primary); border-color:var(--primary); color:#fff; font-size:13px; }
.sheet-foot { flex:none; display:flex; align-items:center; gap:10px; padding:10px 16px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(to top, rgba(10,10,10,.92), rgba(10,10,10,.72)); backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%); box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.sheet-foot .prim { flex:1; min-height:46px; border:0; border-radius:999px; background:var(--primary); color:#fff; font:600 15px/1 var(--font); display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; transition:transform 140ms ease; }
.sheet-foot .prim i, .sheet-foot .prim .prim-label { transition:filter 160ms ease, opacity 160ms ease; }
.sheet-foot .prim.morphing i, .sheet-foot .prim.morphing .prim-label { filter:blur(2px); opacity:.35; }
.sheet-foot .prim.pop { transition:transform 220ms cubic-bezier(0.23,1,0.32,1); transform:scale(1.04); }
.sheet-foot .prim i { font-size:18px; }
.sheet-foot .prim:active { transform:scale(.98); }
.sheet-foot .prim:disabled { opacity:.45; cursor:default; }
.sheet-foot .ghost { position:relative; flex:none; min-height:46px; padding:0 16px; border:0; border-radius:999px; background:rgba(255,255,255,.07); box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); color:var(--foreground); font:600 15px/1 var(--font); cursor:pointer; }
.sheet-foot .ghost:active { transform:scale(.98); }
.sheet-foot .prim:focus-visible, .sheet-foot .ghost:focus-visible { outline:2px solid var(--ring); outline-offset:3px; }
</style>
</head>
<body>

<div class="phone">
  <div class="screen" data-screen-label="Commission Plan">
    <div class="statusbar"><span>9:41</span>
      <div class="sb-icons">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" opacity="0.7"/></svg>
        <svg width="20" height="12" viewBox="0 0 22 12" fill="none" stroke="currentColor"><rect x="1" y="1" width="17" height="10" rx="3"/><rect x="3" y="3" width="11" height="6" rx="1.5" fill="currentColor" stroke="none"/><path d="M20 4v4" stroke-linecap="round"/></svg>
      </div>
    </div>

    <div class="pg-head">
      <a href="CDA Settings.html" class="back-btn" aria-label="Back to CDA Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </a>
      <div class="pg-titlewrap">
        <h1>Commission Plan</h1>
        <div class="pg-subtitle">Default split structures for agents and teams.</div>
      </div>
    </div>

    <div class="scroll">
      <div class="gcard" id="planList"></div>
    </div>
    <button class="fab" type="button" id="addPlanBtn" aria-label="Add plan"><i class="ph ph-plus"></i></button>

    <!-- Add/Edit Commission Plan -->
    <div class="sheet" id="planSheet" hidden>
      <div class="sheet-head">
        <div class="sheet-titlewrap">
          <h2 class="sheet-title" id="planTitle">Add Commission Plan</h2>
          <div class="sheet-subtitle">Define split rules and caps.</div>
        </div>
        <button class="sheet-x" id="planClose" aria-label="Close"><i class="ph ph-x"></i></button>
      </div>
      <div class="sheet-scroll">
        <div class="fld">
          <label>Plan Name</label>
          <input type="text" id="fName" placeholder="e.g., 80/20 Standard">
        </div>
        <div class="fld">
          <label>Plan Type</label>
          <button class="dd-btn" id="ddType"><span id="ddTypeVal">Standard</span><i class="ph ph-caret-down"></i></button>
          <div class="dd-list" id="ddTypeList">
            <button type="button" class="dd-item" data-val="standard">Standard<i class="ph ph-check" hidden></i></button>
            <button type="button" class="dd-item" data-val="tiered">Tiered<i class="ph ph-check" hidden></i></button>
          </div>
        </div>
        <div class="fld">
          <label>Commission Base</label>
          <button class="dd-btn" id="ddBase"><span id="ddBaseVal">Gross Commission</span><i class="ph ph-caret-down"></i></button>
          <div class="dd-list" id="ddBaseList">
            <button type="button" class="dd-item" data-val="gross">Gross Commission<i class="ph ph-check" hidden></i></button>
            <button type="button" class="dd-item" data-val="grossPost">Gross Commission Post Deduction<i class="ph ph-check" hidden></i></button>
          </div>
        </div>
        <div class="fld">
          <label>Split between</label>
          <div class="sh-tabs" role="tablist" aria-label="Split between">
            <button type="button" class="sh-tab" role="tab" id="segTeam" aria-selected="true">Team Members</button>
            <button type="button" class="sh-tab" role="tab" id="segGroup" aria-selected="false">Group</button>
          </div>
          <div class="fld-help" id="splitHelp">Splits GCI between the Agent and the Team Lead.</div>
        </div>
        <div class="split-row">
          <div class="fld">
            <label id="splitALabel">Agent Split %</label>
            <input type="number" id="fSplitA" value="80">
          </div>
          <div class="fld">
            <label>Team Split %</label>
            <input type="number" id="fSplitB" value="20">
          </div>
        </div>
        <div class="fld-help" id="splitSum">Agent + Team must equal 100%. Current: 100%</div>
        <div class="fld">
          <label>Fixed Fee</label>
          <div class="curr"><span>$</span><input type="number" id="fFee" placeholder="0"></div>
        </div>
      </div>
      <div class="sheet-foot">
        <button class="prim" id="planSaveBtn" type="button" disabled><i class="ph ph-floppy-disk" id="planSaveIcon"></i><span class="prim-label" id="planSaveLabel">Save Plan</span></button>
        <button class="ghost" id="planCancel" type="button">Cancel</button>
      </div>
    </div>

    <!-- Assign Defaults -->
    <div class="sheet" id="assignSheet" hidden>
      <div class="sheet-head">
        <div class="sheet-titlewrap">
          <h2 class="sheet-title">Assign Defaults</h2>
          <div class="sheet-subtitle">Set default plans and fees for agents.</div>
        </div>
        <button class="sheet-x" id="assignClose" aria-label="Close"><i class="ph ph-x"></i></button>
      </div>
      <div class="sheet-scroll">
        <div class="fld">
          <label>Source</label>
          <button class="dd-btn" id="ddSource"><span id="ddSourceVal">Referral</span><i class="ph ph-caret-down"></i></button>
          <div class="dd-list" id="ddSourceList">
            <button type="button" class="dd-item" data-val="Zillow">Zillow<i class="ph ph-check" hidden></i></button>
            <button type="button" class="dd-item" data-val="Referral">Referral<i class="ph ph-check" hidden></i></button>
            <button type="button" class="dd-item" data-val="Self-generated">Self-generated<i class="ph ph-check" hidden></i></button>
            <button type="button" class="dd-item" data-val="Sphere">Sphere<i class="ph ph-check" hidden></i></button>
            <button type="button" class="dd-item" data-val="Other">Other<i class="ph ph-check" hidden></i></button>
          </div>
        </div>
        <div class="fld">
          <label>Apply To Commission Breakdown Types<span class="req">*</span></label>
          <button class="dd-btn" id="ddBreakdown"><span id="ddBreakdownVal">Select types</span><i class="ph ph-caret-down"></i></button>
          <div class="dd-list" id="ddBreakdownList">
            <button type="button" class="chk-item" data-val="__all"><span class="chk-box" id="chkAll"></span>Select All</button>
            <button type="button" class="chk-item" data-val="Purchase"><span class="chk-box"></span>Purchase</button>
            <button type="button" class="chk-item" data-val="Listing"><span class="chk-box"></span>Listing</button>
            <button type="button" class="chk-item" data-val="Referral"><span class="chk-box"></span>Referral</button>
            <button type="button" class="chk-item" data-val="Lease"><span class="chk-box"></span>Lease</button>
            <button type="button" class="chk-item" data-val="Lease listing"><span class="chk-box"></span>Lease listing</button>
          </div>
        </div>
        <div class="fld">
          <label>Assign To</label>
          <button class="dd-btn" id="ddAssignTo"><span id="ddAssignToVal">All members</span><i class="ph ph-caret-down"></i></button>
          <div class="dd-list" id="ddAssignToList">
            <button type="button" class="dd-item" data-val="All members">All members<i class="ph ph-check" hidden></i></button>
            <button type="button" class="dd-item" data-val="All groups">All groups<i class="ph ph-check" hidden></i></button>
            <button type="button" class="dd-item" data-val="Specific members">Specific members<i class="ph ph-check" hidden></i></button>
            <button type="button" class="dd-item" data-val="Specific groups">Specific groups<i class="ph ph-check" hidden></i></button>
          </div>
        </div>
      </div>
      <div class="sheet-foot">
        <button class="prim" id="assignSaveBtn" type="button" disabled><i class="ph ph-check-circle" id="assignSaveIcon"></i><span class="prim-label" id="assignSaveLabel">Assign Defaults</span></button>
        <button class="ghost" id="assignCancel" type="button">Cancel</button>
      </div>
    </div>

  </div>
</div>

<script>
var plans = [
  { id:1, name:'80/20 Standard', type:'standard', base:'gross', splitBetween:'team', splitA:80, splitB:20, fee:495, createdBy:'You', groupTag:false, assign:false, agents:['TA','MK','RJ','+2'] },
  { id:2, name:'70/30 Standard', type:'standard', base:'gross', splitBetween:'team', splitA:70, splitB:30, fee:0, createdBy:'You', groupTag:false, assign:false, agents:['EW','JM','SL'] },
  { id:3, name:'Keystone Tiered', type:'tiered', base:'gross', splitBetween:'team', splitA:60, splitB:40, fee:0, createdBy:'Group: West', groupTag:false, assign:false, agents:['DC','NP'] },
  { id:4, name:'Lease Referral Plan', type:'standard', base:'gross', splitBetween:'team', splitA:80, splitB:20, fee:0, createdBy:'Group: East', groupTag:false, assign:true, assignedDefaults:null },
  { id:5, name:'Group 60/40 (Base)', type:'standard', base:'gross', splitBetween:'group', splitA:60, splitB:40, fee:0, createdBy:'You', groupTag:true, assign:true, assignedDefaults:null },
  { id:6, name:'Luxury Sales Price Base', type:'tiered', base:'gross', splitBetween:'team', splitA:80, splitB:20, fee:0, createdBy:'You', groupTag:true, assign:true, assignedDefaults:null }
];
var nextId = 7;
var editingId = null;
var assignTargetId = null;

function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

function rowHTML(p){
  var typeBadge = '<span class="cp-type ' + p.type + '">' + (p.type === 'tiered' ? 'Tiered' : 'Standard') + '</span>';
  var groupTag = p.groupTag ? '<span class="cp-group-tag">Group</span>' : '';
  var byHTML = p.createdBy === 'You' ? 'Created by <b>You</b>' : 'Created by <span class="cp-group-tag">' + esc(p.createdBy) + '</span>';
  var right;
  if (p.assign) {
    right = p.assignedDefaults
      ? '<span class="cp-assigned-tag"><i class="ph ph-check-circle"></i> Assigned</span>'
      : '<button class="cp-assign" type="button" data-assign="' + p.id + '">Assign</button>';
  } else if (p.agents && p.agents.length) {
    right = '<div class="astack">' + p.agents.map(function(a){ return '<span class="ini">' + esc(a) + '</span>'; }).join('') + '</div>';
  } else {
    right = '<span class="cp-none">No agents yet</span>';
  }
  return '<div class="cp-row" data-row="' + p.id + '" role="button" tabindex="0">' +
    '<div class="cp-content">' +
      '<div class="cp-top"><span class="cp-name">' + esc(p.name) + '</span>' + groupTag + typeBadge + '</div>' +
      '<div class="cp-foot"><span class="cp-by">' + byHTML + '</span>' + right + '</div>' +
    '</div>' +
    '<i class="ph ph-caret-right cp-chev"></i>' +
  '</div>';
}

function renderList(){
  var el = document.getElementById('planList');
  el.innerHTML = plans.map(rowHTML).join('');
  el.querySelectorAll('.cp-row').forEach(function(row){
    function activate(e){
      if (e.target.closest('[data-assign]')) return;
      var plan = plans.find(function(p){ return p.id === Number(row.getAttribute('data-row')); });
      openPlanSheet(plan, row);
    }
    row.addEventListener('click', activate);
    row.addEventListener('keydown', function(e){
      if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('[data-assign]')) { e.preventDefault(); activate(e); }
    });
  });
  el.querySelectorAll('[data-assign]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var plan = plans.find(function(p){ return p.id === Number(btn.getAttribute('data-assign')); });
      openAssignSheet(plan, btn);
    });
  });
}

/* ---- dropdown helper ---- */
function wireDropdown(btnId, listId, onSelect){
  var btn = document.getElementById(btnId), list = document.getElementById(listId);
  btn.addEventListener('click', function(){
    var isOpen = list.classList.contains('open');
    document.querySelectorAll('.dd-list.open').forEach(function(l){ l.classList.remove('open'); });
    document.querySelectorAll('.dd-btn.open').forEach(function(b){ b.classList.remove('open'); });
    if (!isOpen) { list.classList.add('open'); btn.classList.add('open'); }
  });
  list.querySelectorAll('.dd-item').forEach(function(item){
    item.addEventListener('click', function(){
      onSelect(item.getAttribute('data-val'), item.textContent.trim());
      list.classList.remove('open');
      btn.classList.remove('open');
    });
  });
}

/* ---- Plan sheet state ---- */
var pType = 'standard', pBase = 'gross', pSplitBetween = 'team';

function setDDCheck(listId, val){
  document.querySelectorAll('#' + listId + ' .dd-item').forEach(function(item){
    var on = item.getAttribute('data-val') === val;
    item.classList.toggle('sel', on);
    item.querySelector('i').hidden = !on;
  });
}

wireDropdown('ddType', 'ddTypeList', function(val, label){
  pType = val;
  document.getElementById('ddTypeVal').textContent = label.replace(/\s*$/,'');
  setDDCheck('ddTypeList', val);
});
wireDropdown('ddBase', 'ddBaseList', function(val, label){
  pBase = val;
  document.getElementById('ddBaseVal').textContent = label;
  setDDCheck('ddBaseList', val);
});

function updateSplitUI(){
  var isGroup = pSplitBetween === 'group';
  document.getElementById('segTeam').setAttribute('aria-selected', String(!isGroup));
  document.getElementById('segGroup').setAttribute('aria-selected', String(isGroup));
  document.getElementById('splitALabel').textContent = isGroup ? 'Group Split %' : 'Agent Split %';
  document.getElementById('splitHelp').textContent = isGroup ? 'Splits GCI between the Group and the Team Lead.' : 'Splits GCI between the Agent and the Team Lead.';
  validatePlan();
}
document.getElementById('segTeam').addEventListener('click', function(){ pSplitBetween = 'team'; updateSplitUI(); });
document.getElementById('segGroup').addEventListener('click', function(){ pSplitBetween = 'group'; updateSplitUI(); });

function validatePlan(){
  var a = Number(document.getElementById('fSplitA').value) || 0;
  var b = Number(document.getElementById('fSplitB').value) || 0;
  var sum = a + b;
  var noun = pSplitBetween === 'group' ? 'Group' : 'Agent';
  var help = document.getElementById('splitSum');
  help.textContent = noun + ' + Team must equal 100%. Current: ' + sum + '%';
  help.classList.toggle('err', sum !== 100);
  var name = document.getElementById('fName').value.trim();
  var valid = name.length > 0 && sum === 100;
  document.getElementById('planSaveBtn').disabled = !valid;
}
document.getElementById('fName').addEventListener('input', validatePlan);
document.getElementById('fSplitA').addEventListener('input', validatePlan);
document.getElementById('fSplitB').addEventListener('input', validatePlan);

function openPlanSheet(plan, triggerEl){
  editingId = plan ? plan.id : null;
  document.getElementById('planTitle').textContent = plan ? 'Edit Commission Plan' : 'Add Commission Plan';
  document.getElementById('fName').value = plan ? plan.name : '';
  pType = plan ? plan.type : 'standard';
  pBase = plan ? plan.base : 'gross';
  pSplitBetween = plan ? plan.splitBetween : 'team';
  document.getElementById('ddTypeVal').textContent = pType === 'tiered' ? 'Tiered' : 'Standard';
  setDDCheck('ddTypeList', pType);
  document.getElementById('ddBaseVal').textContent = pBase === 'grossPost' ? 'Gross Commission Post Deduction' : 'Gross Commission';
  setDDCheck('ddBaseList', pBase);
  document.getElementById('fSplitA').value = plan ? plan.splitA : 80;
  document.getElementById('fSplitB').value = plan ? plan.splitB : 20;
  document.getElementById('fFee').value = plan && plan.fee ? plan.fee : '';
  updateSplitUI();
  validatePlan();
  showSheet('planSheet', triggerEl);
}
function closePlanSheet(){ hideSheet('planSheet'); editingId = null; }

document.getElementById('addPlanBtn').addEventListener('click', function(){ openPlanSheet(null, this); });
document.getElementById('planClose').addEventListener('click', closePlanSheet);
document.getElementById('planCancel').addEventListener('click', closePlanSheet);
document.getElementById('planSaveBtn').addEventListener('click', function(){ if (this.disabled) return; playPrimSuccess(this, 'planSaveIcon', 'planSaveLabel', 'ph ph-check-circle', 'Saved', savePlan); });

function playPrimSuccess(btn, iconId, labelId, toIcon, toLabel, onDone){
  var icon = document.getElementById(iconId), label = document.getElementById(labelId);
  var fromIconClass = icon.className, fromLabel = label.textContent;
  btn.classList.add('morphing');
  setTimeout(function(){
    icon.className = toIcon;
    label.textContent = toLabel;
    btn.classList.remove('morphing');
    btn.classList.add('pop');
    setTimeout(function(){ btn.classList.remove('pop'); }, 220);
  }, 160);
  setTimeout(function(){
    onDone();
    setTimeout(function(){ icon.className = fromIconClass; label.textContent = fromLabel; }, 200);
  }, 340);
}

function savePlan(){
  var data = {
    name: document.getElementById('fName').value.trim(),
    type: pType, base: pBase, splitBetween: pSplitBetween,
    splitA: Number(document.getElementById('fSplitA').value) || 0,
    splitB: Number(document.getElementById('fSplitB').value) || 0,
    fee: Number(document.getElementById('fFee').value) || 0
  };
  if (editingId) {
    var p = plans.find(function(pl){ return pl.id === editingId; });
    Object.assign(p, data);
  } else {
    plans.push(Object.assign({ id: nextId++, createdBy:'You', groupTag:false, assign:false, agents:[] }, data));
  }
  renderList();
  closePlanSheet();
}

/* ---- Assign Defaults sheet ---- */
var aSource = 'Referral', aTypes = ['Purchase','Listing'], aAssignTo = 'All members';
var breakdownAll = ['Purchase','Listing','Referral','Lease','Lease listing'];

wireDropdown('ddSource', 'ddSourceList', function(val){
  aSource = val;
  document.getElementById('ddSourceVal').textContent = val;
  setDDCheck('ddSourceList', val);
});
wireDropdown('ddAssignTo', 'ddAssignToList', function(val){
  aAssignTo = val;
  document.getElementById('ddAssignToVal').textContent = val;
  setDDCheck('ddAssignToList', val);
});

var ddBreakdownBtn = document.getElementById('ddBreakdown'), ddBreakdownList = document.getElementById('ddBreakdownList');
ddBreakdownBtn.addEventListener('click', function(){
  var isOpen = ddBreakdownList.classList.contains('open');
  document.querySelectorAll('.dd-list.open').forEach(function(l){ l.classList.remove('open'); });
  document.querySelectorAll('.dd-btn.open').forEach(function(b){ b.classList.remove('open'); });
  if (!isOpen) { ddBreakdownList.classList.add('open'); ddBreakdownBtn.classList.add('open'); }
});
ddBreakdownList.querySelectorAll('.chk-item').forEach(function(item){
  item.addEventListener('click', function(){
    var val = item.getAttribute('data-val');
    if (val === '__all') {
      aTypes = aTypes.length === breakdownAll.length ? [] : breakdownAll.slice();
    } else {
      var i = aTypes.indexOf(val);
      if (i >= 0) aTypes.splice(i, 1); else aTypes.push(val);
    }
    renderBreakdown();
  });
});
function renderBreakdown(){
  ddBreakdownList.querySelectorAll('.chk-item').forEach(function(item){
    var val = item.getAttribute('data-val');
    var checked = val === '__all' ? aTypes.length === breakdownAll.length : aTypes.indexOf(val) >= 0;
    var box = item.querySelector('.chk-box');
    box.classList.toggle('checked', checked);
    box.innerHTML = checked ? '<i class="ph ph-check"></i>' : '';
  });
  var summary = aTypes.length === 0 ? 'Select types' : (aTypes.length === 1 ? aTypes[0] : aTypes[0] + ' +' + (aTypes.length - 1) + ' others');
  document.getElementById('ddBreakdownVal').textContent = summary;
  document.getElementById('assignSaveBtn').disabled = aTypes.length === 0;
}

function openAssignSheet(plan, triggerEl){
  assignTargetId = plan.id;
  var d = plan.assignedDefaults;
  aSource = d ? d.source : 'Referral';
  aTypes = d ? d.types.slice() : ['Purchase','Listing'];
  aAssignTo = d ? d.assignTo : 'All members';
  document.getElementById('ddSourceVal').textContent = aSource;
  setDDCheck('ddSourceList', aSource);
  document.getElementById('ddAssignToVal').textContent = aAssignTo;
  setDDCheck('ddAssignToList', aAssignTo);
  renderBreakdown();
  showSheet('assignSheet', triggerEl);
}
function closeAssignSheet(){ hideSheet('assignSheet'); assignTargetId = null; }
document.getElementById('assignClose').addEventListener('click', closeAssignSheet);
document.getElementById('assignCancel').addEventListener('click', closeAssignSheet);
document.getElementById('assignSaveBtn').addEventListener('click', function(){
  if (this.disabled) return;
  var btn = this;
  playPrimSuccess(btn, 'assignSaveIcon', 'assignSaveLabel', 'ph ph-check-circle', 'Assigned', function(){
    var plan = plans.find(function(p){ return p.id === assignTargetId; });
    plan.assignedDefaults = { source: aSource, types: aTypes.slice(), assignTo: aAssignTo };
    renderList();
    closeAssignSheet();
  });
});

var lastFocused = null;
function sheetKeyHandler(e){
  var openSheet = document.querySelector('.sheet.show');
  if (!openSheet) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    if (openSheet.id === 'planSheet') closePlanSheet(); else closeAssignSheet();
    return;
  }
  if (e.key === 'Tab') {
    var focusables = Array.prototype.slice.call(openSheet.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])')).filter(function(el){ return !el.disabled && el.offsetParent !== null; });
    if (!focusables.length) return;
    var first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}
function showSheet(id, triggerEl){
  lastFocused = triggerEl || document.activeElement;
  var el = document.getElementById(id);
  if (el._hideTimer) { clearTimeout(el._hideTimer); el._hideTimer = null; }
  el.classList.remove('closing');
  el.hidden = false;
  requestAnimationFrame(function(){ el.classList.add('show'); });
  document.addEventListener('keydown', sheetKeyHandler);
  setTimeout(function(){ var f = el.querySelector('.sheet-x'); if (f) f.focus(); }, 300);
}
function hideSheet(id){
  var el = document.getElementById(id);
  if (el._hideTimer) clearTimeout(el._hideTimer);
  el.classList.add('closing');
  el.classList.remove('show');
  document.removeEventListener('keydown', sheetKeyHandler);
  el._hideTimer = setTimeout(function(){ el.hidden = true; el.classList.remove('closing'); el._hideTimer = null; if (lastFocused) lastFocused.focus(); }, 200);
}

renderList();
</script>
